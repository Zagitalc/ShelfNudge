services:
  - type: web
    name: shelf-nudge
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: shelf-nudge-db
          property: connectionString

databases:
  - name: shelf-nudge-db
    databaseName: shelf_nudge
    user: shelf_nudge
    plan: free
